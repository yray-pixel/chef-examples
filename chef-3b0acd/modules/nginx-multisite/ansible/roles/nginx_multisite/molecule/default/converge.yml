      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local

    # Create index.html files for each site
    - name: Create index.html for test site
      ansible.builtin.copy:
        content: "<html><body><h1>Test Site</h1><p>This is the test site.</p></body></html>"
        dest: /tmp/molecule_test/opt/server/test/index.html
        mode: "0644"

    - name: Create index.html for ci site
      ansible.builtin.copy:
        content: "<html><body><h1>CI Site</h1><p>This is the CI site.</p></body></html>"
        dest: /tmp/molecule_test/opt/server/ci/index.html
        mode: "0644"

    - name: Create index.html for status site
      ansible.builtin.copy:
        content: "<html><body><h1>Status Site</h1><p>This is the status site.</p></body></html>"
        dest: /tmp/molecule_test/opt/server/status/index.html
        mode: "0644"

    # Create UFW status files to simulate UFW commands
    - name: Create UFW status files
      ansible.builtin.file:
        path: "/tmp/molecule_test/var/lib/ansible/{{ item }}"
        state: touch
        mode: "0644"
      loop:
        - ufw_default_deny
        - ufw_allow_ssh
        - ufw_allow_http
        - ufw_allow_https
        - ufw_enable