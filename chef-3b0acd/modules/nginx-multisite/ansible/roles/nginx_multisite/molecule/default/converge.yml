      ansible.builtin.copy:
        content: "-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQDGRHzL1UFCfIXY\n1MrDf4NRmzJ7rQnuHGNmSQjJUyArFBHPHNXDAZNjCuoDvxnKUii+5d0oZUBkgQO1\nuIXzJQqBU3u40vgOL6VPt8XGcNEFAEZgLHXWMJBNrxzxF+TZY3K5B5lW7FzUxKUL\ncHkn8JFQHtMhZQkCEeB5MUmwLBOGuwZm3yrZzB4Xt0YpLiPJgTcVvYa5MfMSQPsv\nfLmU7S/BA9QNgOHxZS/CnDthuMlQnwzn++gZV3eFl1jV7Jb5jBVKVIR+vbIiHUaW\nSGFoKGVFGP9d/7+NjgDDcbXOKXRIGJYnkGHpFvYTOzDJlykpIFPDG+MZ0QBGGbHK\nvAgMBAAECggEAYs6/RU/7H/OG/v4zIBJwL8N0s1g5VNMwmhPwQWsHyTTM5Ck0hHyV\nfzCQIxNFGWPJMEQyHMMYdpxUJG2yzMgRs5uo0qYHtJWIzHuLs1WOAGjnDQgG/JyX\nG5FOg0I4xJQWWD9+tLSHKB5MJbfUVS9cHBqqgqS2JVGD0+lWnEZ+Xg5JgVTOLGTD\nQEK/CjwNDWQOzH/x1QpZ4s0XMYuGCjYvxKqUEJ5OGqIVEJNZzqYSNDUQlKj5PM8q\nTYXtGX5t5Ry3zLQ+uTgdHUJKYzgS5N7fBGFVTNq8kNQXOoUjCCRCFYI+IURDOQWJ\nYPVVqQ1cXk4WLVcCQXmSZi1zCjvjjIUBUxzQAQKBgQDpLidgYZ7JQwOZjbJQvBp1\nKyGTJOK6lVUXRRAvP8hWJJk8MHpO/qxCBHXTKsHFxTXHBZ+7XCTpvjzgVPaHXiVD\nQUJhUzHFkIEFYv5VX9KHlzKEcOmGQbGjCHBXeno4OUwKmQhMDy5Ec+6u1sSHkFqJ\nC8JWfO4kS4tU3k7xWuQQAQKBgQDZuZs/B4TuZQG1QDEwA0aJJMuCgb0U1gCvJQ0i\nCVG8V+FDHqcIVH7OOsNkN0Wk2qyi/GhKwVEJZKTOjy4XRLIGFkF0bFc3qWARgYYS\nRBaFjZCaaaE0RJ0YWjdVKyOGNYwVxpX7674a8GyNrKcaY9FcAPNZWIiKhxAunRnL\nrwKBgQDZuZs/B4TuZQG1QDEwA0aJJMuCgb0U1gCvJQ0iCVG8V+FDHqcIVH7OOsNk\nN0Wk2qyi/GhKwVEJZKTOjy4XRLIGFkF0bFc3qWARgYYSRBaFjZCaaaE0RJ0YWjdV\nKyOGNYwVxpX7674a8GyNrKcaY9FcAPNZWIiKhxAunRnLrwKBgQDZuZs/B4TuZQG1\nQDEwA0aJJMuCgb0U1gCvJQ0iCVG8V+FDHqcIVH7OOsNkN0Wk2qyi/GhKwVEJZKTO\njy4XRLIGFkF0bFc3qWARgYYSRBaFjZCaaaE0RJ0YWjdVKyOGNYwVxpX7674a8GyN\nrKcaY9FcAPNZWIiKhxAunRnLrwKBgQDZuZs/B4TuZQG1QDEwA0aJJMuCgb0U1gCv\nJQ0iCVG8V+FDHqcIVH7OOsNkN0Wk2qyi/GhKwVEJZKTOjy4XRLIGFkF0bFc3qWAR\ngYYSRBaFjZCaaaE0RJ0YWjdVKyOGNYwVxpX7674a8GyNrKcaY9FcAPNZWIiKhxAu\nnRnLrw==\n-----END PRIVATE KEY-----"
