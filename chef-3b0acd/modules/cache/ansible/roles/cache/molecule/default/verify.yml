- name: Verify
  hosts: all
  gather_facts: true
  tasks:
  - name: Check Redis configuration file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/redis/6379.conf
    register: redis_conf
  - name: Assert Redis configuration file exists
    ansible.builtin.assert:
      that:
      - redis_conf.stat.exists
      - redis_conf.stat.size > 0
      fail_msg: Redis configuration file not found or empty
      success_msg: Redis configuration file exists and has content
  - name: Get Redis configuration file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/redis/6379.conf
    register: redis_conf_content
    when: redis_conf.stat.exists
  - name: Verify Redis port and password configuration
    ansible.builtin.assert:
      that:
      - '''port 6379'' in (redis_conf_content.content | b64decode)'
      - '''requirepass redis_secure_password_123'' in (redis_conf_content.content | b64decode)'
      fail_msg: Redis configuration does not contain expected port or password settings
      success_msg: Redis configuration contains expected port and password settings
    when: redis_conf.stat.exists
  - name: Verify Redis replication settings are absent
    ansible.builtin.assert:
      that:
      - '''replica-serve-stale-data'' not in (redis_conf_content.content | b64decode)'
      - '''replica-read-only'' not in (redis_conf_content.content | b64decode)'
      - '''repl-ping-replica-period'' not in (redis_conf_content.content | b64decode)'
      - '''client-output-buffer-limit'' not in (redis_conf_content.content | b64decode)'
      - '''replica-priority'' not in (redis_conf_content.content | b64decode)'
      fail_msg: Redis configuration contains replication settings that should be removed
      success_msg: Redis configuration does not contain replication settings as expected
    when: redis_conf.stat.exists
  - name: Check Redis log directory exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/log/redis
    register: redis_log_dir
  - name: Assert Redis log directory exists
    ansible.builtin.assert:
      that:
      - redis_log_dir.stat.exists
      - redis_log_dir.stat.isdir
      fail_msg: Redis log directory not found
      success_msg: Redis log directory exists
  - name: Check Debian Memcached configuration file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/memcached.conf
    register: memcached_conf_debian
    when: ansible_os_family == "Debian"
  - name: Assert Debian Memcached configuration file exists
    ansible.builtin.assert:
      that:
      - memcached_conf_debian.stat.exists
      - memcached_conf_debian.stat.size > 0
      fail_msg: Debian Memcached configuration file not found or empty
      success_msg: Debian Memcached configuration file exists and has content
    when: ansible_os_family == "Debian" and memcached_conf_debian.stat is defined
  - name: Check RedHat Memcached configuration file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysconfig/memcached
    register: memcached_conf_redhat
    when: ansible_os_family == "RedHat"
  - name: Assert RedHat Memcached configuration file exists
    ansible.builtin.assert:
      that:
      - memcached_conf_redhat.stat.exists
      - memcached_conf_redhat.stat.size > 0
      fail_msg: RedHat Memcached configuration file not found or empty
      success_msg: RedHat Memcached configuration file exists and has content
    when: ansible_os_family == "RedHat" and memcached_conf_redhat.stat is defined
  - name: Check Redis service status
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Redis service is running
    ansible.builtin.assert:
      that:
      - '''redis@6379.service'' in ansible_facts.services'
      - ansible_facts.services['redis@6379.service'].state == 'running'
      fail_msg: Redis service is not running
      success_msg: Redis service is running
    tags: molecule-notest
  - name: Assert Memcached service is running
    ansible.builtin.assert:
      that:
      - '''memcached.service'' in ansible_facts.services'
      - ansible_facts.services['memcached.service'].state == 'running'
      fail_msg: Memcached service is not running
      success_msg: Memcached service is running
    tags: molecule-notest
  - name: Check Redis port is listening
    ansible.builtin.wait_for:
      port: 6379
      state: started
      timeout: 5
    tags: molecule-notest
  - name: Check Memcached port is listening
    ansible.builtin.wait_for:
      port: 11211
      state: started
      timeout: 5
    tags: molecule-notest
