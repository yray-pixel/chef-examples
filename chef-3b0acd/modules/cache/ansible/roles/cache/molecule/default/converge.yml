- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/redis
    - /tmp/molecule_test/var/log/redis
    - /tmp/molecule_test/var/run/redis
    - /tmp/molecule_test/var/lib/redis
    - /tmp/molecule_test/etc/sysconfig
    - /tmp/molecule_test/etc
  - name: Create Redis configuration file
    ansible.builtin.copy:
      content: '# Redis configuration file

        # Generated by Ansible


        # Network

        bind 127.0.0.1

        port 6379

        protected-mode yes


        # General

        daemonize yes

        pidfile /var/run/redis/redis-6379.pid

        loglevel notice

        logfile /var/log/redis/redis_6379.log


        # Security

        requirepass redis_secure_password_123


        # Memory management

        maxmemory-policy allkeys-lru

        maxmemory-samples 5


        # Persistence

        save 900 1

        save 300 10

        save 60 10000

        stop-writes-on-bgsave-error yes

        rdbcompression yes

        rdbchecksum yes

        dbfilename dump-6379.rdb

        dir /var/lib/redis


        # Advanced config

        tcp-keepalive 300

        timeout 0

        tcp-backlog 511

        databases 16

        '
      dest: /tmp/molecule_test/etc/redis/6379.conf
      mode: '0640'
  - name: Create Debian Memcached configuration file
    ansible.builtin.copy:
      content: '# memcached default config file

        # See /etc/memcached.conf for more information


        -d

        -m 64

        -p 11211

        -u memcached

        -l 127.0.0.1

        -c 1024

        '
      dest: /tmp/molecule_test/etc/memcached.conf
      mode: '0644'
    when: ansible_os_family == "Debian"
  - name: Create RedHat Memcached configuration file
    ansible.builtin.copy:
      content: '# For RedHat-based systems

        PORT="11211"

        USER="memcached"

        MAXCONN="1024"

        CACHESIZE="64"

        OPTIONS="-l 127.0.0.1"

        '
      dest: /tmp/molecule_test/etc/sysconfig/memcached
      mode: '0644'
    when: ansible_os_family == "RedHat"
