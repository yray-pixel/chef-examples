- name: Verify
  hosts: all
  gather_facts: false
  vars:
    fastapi_app_dir: /tmp/molecule_test/opt/fastapi-tutorial
    python_venv_path: /tmp/molecule_test/opt/fastapi-tutorial/venv
    service_name: fastapi-tutorial
    fastapi_port: 8000
  tasks:
  - name: Check application directory exists
    ansible.builtin.stat:
      path: '{{ fastapi_app_dir }}'
    register: app_dir
  - name: Assert application directory was created
    ansible.builtin.assert:
      that:
      - app_dir.stat.exists
      - app_dir.stat.isdir
      fail_msg: Application directory not found
      success_msg: Application directory exists
  - name: Check Python virtual environment exists
    ansible.builtin.stat:
      path: '{{ python_venv_path }}'
    register: venv_dir
  - name: Assert Python virtual environment was created
    ansible.builtin.assert:
      that:
      - venv_dir.stat.exists
      - venv_dir.stat.isdir
      fail_msg: Python virtual environment not found
      success_msg: Python virtual environment exists
  - name: Check Python executable exists in venv
    ansible.builtin.stat:
      path: '{{ python_venv_path }}/bin/python'
    register: python_exec
  - name: Assert Python executable exists
    ansible.builtin.assert:
      that:
      - python_exec.stat.exists
      - python_exec.stat.executable
      fail_msg: Python executable not found in venv
      success_msg: Python executable exists in venv
  - name: Check uvicorn executable exists in venv
    ansible.builtin.stat:
      path: '{{ python_venv_path }}/bin/uvicorn'
    register: uvicorn_exec
  - name: Assert uvicorn executable exists
    ansible.builtin.assert:
      that:
      - uvicorn_exec.stat.exists
      - uvicorn_exec.stat.executable
      fail_msg: uvicorn executable not found in venv
      success_msg: uvicorn executable exists in venv
  - name: Check environment configuration file exists
    ansible.builtin.stat:
      path: '{{ fastapi_app_dir }}/.env'
    register: env_file
  - name: Assert environment configuration file was created
    ansible.builtin.assert:
      that:
      - env_file.stat.exists
      - env_file.stat.size > 0
      fail_msg: Environment configuration file not found
      success_msg: Environment configuration file exists
  - name: Get environment file content
    ansible.builtin.slurp:
      src: '{{ fastapi_app_dir }}/.env'
    register: env_content
  - name: Assert environment file has required variables
    ansible.builtin.assert:
      that:
      - env_content.content | b64decode | regex_search('PROJECT_NAME')
      - env_content.content | b64decode | regex_search('API_VERSION')
      - env_content.content | b64decode | regex_search('DATABASE_URL=postgresql://fastapi:fastapi_password@localhost/fastapi_db')
      fail_msg: Environment file missing required variables
      success_msg: Environment file contains required variables
  - name: Check systemd service file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/systemd/system/{{ service_name }}.service
    register: service_file
  - name: Assert systemd service file was created
    ansible.builtin.assert:
      that:
      - service_file.stat.exists
      - service_file.stat.size > 0
      fail_msg: Systemd service file not found
      success_msg: Systemd service file exists
  - name: Get systemd service file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/systemd/system/{{ service_name }}.service
    register: service_content
  - name: Assert systemd service file has required configuration
    ansible.builtin.assert:
      that:
      - service_content.content | b64decode | regex_search('Description=FastAPI Tutorial Service')
      - service_content.content | b64decode | regex_search('After=network.target postgresql.service')
      - service_content.content | b64decode | regex_search('WorkingDirectory=/opt/fastapi-tutorial')
      - service_content.content | b64decode | regex_search('ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000')
      fail_msg: Systemd service file missing required configuration
      success_msg: Systemd service file contains required configuration
  - name: Check PostgreSQL service is running
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert PostgreSQL service is active
    ansible.builtin.assert:
      that:
      - '''postgresql.service'' in ansible_facts.services'
      - ansible_facts.services['postgresql.service'].state == 'running'
      fail_msg: PostgreSQL service not running
      success_msg: PostgreSQL service is running
    tags: molecule-notest
  - name: Check FastAPI service is running
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert FastAPI service is active
    ansible.builtin.assert:
      that:
      - '''fastapi-tutorial.service'' in ansible_facts.services'
      - ansible_facts.services['fastapi-tutorial.service'].state == 'running'
      fail_msg: FastAPI service not running
      success_msg: FastAPI service is running
    tags: molecule-notest
  - name: Check if FastAPI port is listening
    ansible.builtin.wait_for:
      port: '{{ fastapi_port }}'
      timeout: 5
    tags: molecule-notest
  - name: Check FastAPI application health
    ansible.builtin.uri:
      url: http://localhost:{{ fastapi_port }}/
      status_code: 200
    tags: molecule-notest
  - name: Check FastAPI docs endpoint
    ansible.builtin.uri:
      url: http://localhost:{{ fastapi_port }}/docs
      status_code: 200
    tags: molecule-notest
