---
- name: Install nginx package
  ansible.builtin.package:
    name: nginx
    state: present

- name: Deploy nginx main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Restart nginx

- name: Deploy nginx security configuration
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Restart nginx

- name: Ensure nginx service is enabled and started
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Create document roots for sites  # noqa: R114 - document_root from role defaults
  ansible.builtin.file:
    path: "{{ item_nginx_multisite['value']['document_root'] }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite

- name: Deploy index.html for sites
  ansible.builtin.copy:
    src: "{{ item_nginx_multisite['key'].split('.')[0] }}/index.html" # noqa: R114 - src from role-defined site name folder, trusted
    dest: "{{ item_nginx_multisite['value']['document_root'] }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite
